name: Release

# Every push to main is checked and, when its commits call for a new version,
# built for Windows and macOS, tagged, and published as a GitHub release.
# See scripts/next-version.sh for how the version is chosen: a push with only
# docs, tests, or chores releases nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    name: Choose the version
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version is computed from history and tags

      - id: version
        run: echo "next=$(bash scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.version.outputs.next == ''
        run: echo "No feat, fix, or perf commits since the last release; nothing to publish." >> "$GITHUB_STEP_SUMMARY"

  # MSVC builds, which need no extra runtime files next to the program.
  windows:
    name: Build for Windows
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXT: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc,aarch64-pc-windows-msvc --no-self-update

      - name: Build and zip
        shell: bash
        run: |
          export GOMIC_VERSION="${NEXT#v}"
          mkdir dist
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            target=${pair##*:}-pc-windows-msvc
            cargo build --release --locked --target "$target"
            7z a "dist/gomic_${NEXT#v}_windows_${arch}.zip" \
              "./target/$target/release/gomic.exe" ./LICENSE ./README.md ./README.html
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  macos:
    name: Build for macOS
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NEXT: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build the universal app and zip it
        run: |
          VERSION="${NEXT#v}" UNIVERSAL=1 sh build_mac.sh
          lipo -archs gomic.app/Contents/MacOS/gomic
          codesign --verify --verbose gomic.app
          mkdir dist
          # ditto keeps the signature of the bundle intact, unlike zip.
          ditto -c -k --keepParent gomic.app "dist/gomic_${NEXT#v}_macos_universal.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  # The tag is only created here, after every build has succeeded, so a failed
  # build never leaves a version without downloads.
  publish:
    name: Tag and publish
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
    env:
      NEXT: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip > checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NEXT" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$NEXT" \
            --generate-notes
