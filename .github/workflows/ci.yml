name: CI

# Runs on every pull request, and is reused by the release workflow so a
# release is only ever built from a commit that passed the same checks.
# It can also be started by hand for any branch.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces the older run. Runs for main are
  # never canceled, because a release depends on them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
