[package]
name = "gomic"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A small always-on-top stereo peak meter with latching clip lights"
license = "MIT"
repository = "https://github.com/mareklanduch/gomic"
readme = "README.md"
keywords = ["audio", "meter", "peak", "clip"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda = "0.22"
raw-window-handle = "0.6"
